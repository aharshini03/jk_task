<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }
        body{
            background-image: url("./background.jpg");
            background-repeat: no-repeat;
            background-size: cover;
            background-position: center;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .reg-form{
            width:420px;
            border-radius: 10px;
            color: #fff;
            padding: 30px 40px;
            background: transparent;
            border: 2px solid rgba(255,255,255,0.2);
            backdrop-filter: blur(23px);
        }
        .reg-form h1{
            font-size: 36px;
            text-align: center;
        }
        .reg-form .reg-field{
            width: 100%;
            height: 50px;
            margin: 30px 0;
        }
        .reg-field input{
            width: 100%;
            height: 100%;
            background: transparent;
            border: none;
            outline: none;
            border: 2px solid rgba(255,255,255,0.2);
            border-radius: 40px;
            font-size: 16px;
            color:#fff;
            padding: 20px 45px 20px 20px;
        }
        .reg-field input::placeholder{
            color: #fff;
        }
        .reg-form .reg-gen{
            display: flex;
            justify-content: space-evenly;
            font-size: 17px;
            margin: 10px 10px 10px;
        }
        .reg-gen label input{
            accent-color: #fff;
            margin-right: 3px;
        }
        .reg-form .reg-btn{
            width: 100%;
            height: 45px;
            background: rgb(148, 68, 148);
            border: none;
            outline: none;
            border-radius: 40px;
            font-size: 16px;
            color: #fff;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <div>
    <form class="reg-form" action="./login.html" method="">
            <h1>Register</h1>
        <div class="reg-field">
            <input 
                type="email" 
                placeholder="Email ID"
                name="email"
                id="email" required />
        </div>
        <div class="reg-field">
            <input 
                type="text" 
                placeholder="Firstname"
                name="firstname"
                id="firstname" required >
        </div>
        <div class="reg-field">
            <input 
                type="text" 
                placeholder="Lastname"
                name="lastname"
                id="lastname" required />
        </div><div class="reg-gen">
            <label for="male"><input type="radio" name="gender" id="male" >  Male</label>
            <label for="female"><input type="radio" name="gender" id="female" >  Female</label>
        </div>
        <div class="reg-field">
            <input
                type="password"
                placeholder="Enter password"
                name="password"
                id="password" required />
        </div>
        <div class="reg-field">
            <input
                type="password"
                placeholder="Re-Enter password"
                name="confirm-password"
                id="confirm-password" required />
        </div>
        <div>
            <button class="reg-btn">Register</button>
        </div>
    </form>
    </div>
</body>
</html>
