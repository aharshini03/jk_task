<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }
        body{
            background-image: url("https://user-images.githubusercontent.com/13468728/233847739-219cb494-c265-4554-820a-bd3424c59065.jpg");
            background-repeat: no-repeat;
            background-size: cover;
            background-position: center;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .login{
            width:350px;
            border-radius: 10px;
            color: #fff;
            padding: 30px 40px;
            background: transparent;
            border: 2px solid rgba(255,255,255,0.2);
            backdrop-filter: blur(25px);
        }
        .login h1{
            font-size: 36px;
            text-align: center;
        }
        .login .lgn-field{
            position: relative;
            width: 100%;
            height: 50px;
            margin: 30px 0;
        }
        .lgn-field input{
            width: 100%;
            height: 100%;
            background: transparent;
            border: none;
            outline: none;
            border: 2px solid rgba(255,255,255,0.2);
            border-radius: 40px;
            font-size: 16px;
            color:#fff;
            padding: 20px 45px 20px 20px;
        }
        .lgn-field input::placeholder{
            color: #fff;
        }
        .lgn-field i{
            position: absolute;
            right: 20px;
            top: 50%;
            font-size: 20px;
            transform: translateY(-50%);
        }
        .login .lgn-check{
            display: flex;
            justify-content: space-between;
            font-size: 15px;
            margin: -15px 0 15px;
        }
        .lgn-check label input{
            accent-color: #fff;
            margin-right: 3px;
        }
        .lgn-check a{
            color: #fff;
            text-decoration: underline;
        }
        .login .lgn-btn{
            width: 100%;
            height: 45px;
            background: #fff;
            border: none;
            outline: none;
            border-radius: 40px;
            font-size: 16px;
            color: #333;
            font-weight: 600;
        }
        .login .redirect{
            font-size: 15px;
            text-align: center;
            margin: 20px 0 15px
        }
        .redirect a{
            color: #fff;
            text-decoration:underline;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <div class="login">
        <form action="./blogg.html" method="">
            <h1>Login</h1>
            <div class="lgn-field">
                <input 
                    type="username" 
                    placeholder="Username"
                    name="username"
                    id="username" required >
                    <i class='bx bxs-user'></i>
            </div>
            <div class="lgn-field">
                <input
                    type="password"
                    placeholder="Password"
                    name="password"
                    id="password" required >
                    <i class='bx bxs-lock-alt'></i>
            </div>
            <div class="lgn-check">
                <label for="remember"><input type="checkbox"/>Remember me</label>
                <a href="#">Forgot Password?</a>
            </div>
            <div>
                <button class="lgn-btn">Login</button>
            </div>
            <div class="redirect">
                Don't have an account?
                <a href="./index.html">Register</a>
            </div>
        </form>
    </div>
</body>
</html>
